<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    $(function(){
      let searchHtml = '<button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>';
      let encountHtml = `
        <p class="name"></p>
        <div><img class="img" src="" alt=""></div>
        <div>
          <button class="btn" id="catch">捕まえる</button>
          <button class="btn" data-js="reset">逃げる</button>
        </div>
      `;
      let doneHtml = `
        <p class="name">ゲットしました</p>
        <div><img class="img" src="" alt=""></div>
        <button class="btn" data-js="reset">戻る</button>
      `;
      let failHtml = `
        <p class="text">逃げられてしまった...</p>
        <button class="btn mt" data-js="reset">戻る</button>
      `;
      $('#wrapper').on('click', '#pokemon_search', function(){
        let id = Math.floor(Math.random() * 151)+ 1;

        $.ajax({
          url: 'https://pokeapi.co/api/v2/pokemon/' + id,
          method: 'GET'
        }).done(function(res){
          let img = res.sprites.front_default;

          $.ajax({
            url:res.species.url,
            method:'GET'
          }).done(function(poke){
            let name = poke.names.find(function(name){
              return name.language.name == 'ja'
            }).name;

            $('#wrapper').html(encountHtml);
            $('.name').text(name)
            $('.img').attr('src', img);
          })
        })
      })

      $('#wrapper').on('click', '#catch', function(){
        if (Math.random() < 0.5) {
          $.ajax({
            url:'https://pokeapi.co/api/v2/item/4',
            method:'GET'
          }).done(function(success){
            let img = success.sprites.default
            $('#wrapper').html(doneHtml);
            $('.img').attr('src', img);
          })
        } else {
            $('#wrapper').html(failHtml);
        }
      });

      $('#wrapper').on('click', '[data-js="reset"]', function(){
        $('#wrapper').html(searchHtml);
      })
    });
  </script>
</body>
</html>
